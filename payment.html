<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopScore — Confirming Payment</title><style>body{margin:0;background:#1e1e2f;color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:30px;max-width:400px}.spin{width:45px;height:45px;border:4px solid #333;border-top-color:#1db954;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 18px}@keyframes s{to{transform:rotate(360deg)}}button{padding:13px 18px;border:0;border-radius:10px;background:#1db954;color:white;font-weight:700}</style></head><body><div class="box"><div class="spin" id="spin"></div><h2 id="title">Confirming your payment…</h2><p id="msg" style="color:#aaa">Please don't close this page.</p></div><script src="./topscore-core.js"></script><script>
(async()=>{try{const u=await TopScore.user();if(!u){location.href="./auth.html?mode=login";return}const ref=new URLSearchParams(location.search).get("reference");if(!ref)throw new Error("No payment reference was returned.");const r=await TopScore.call("verifyPayment",{reference:ref});document.getElementById("spin").style.display="none";document.getElementById("title").textContent="🎉 Payment confirmed!";document.getElementById("msg").textContent="Your TopScore premium access is now active.";setTimeout(()=>location.href="./account.html",1200)}catch(e){document.getElementById("spin").style.display="none";document.getElementById("title").textContent="Payment could not be confirmed";document.getElementById("msg").textContent=e.message||"Please contact TopScore support.";}})();
</script></body></html>
