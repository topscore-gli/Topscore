<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopScore Daily JAMB Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#11111d;color:#fff;font-family:system-ui,sans-serif}.app{max-width:720px;margin:auto;padding:18px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:23px;font-weight:950}.brand span{color:#1db954}.btn{border:0;border-radius:11px;padding:11px 15px;background:#27273d;color:#fff;font-weight:800}.green{background:#1db954}.card{background:#1b1b2a;border-radius:20px;padding:20px;margin:14px 0;box-shadow:8px 8px 18px #0d0d15,-5px -5px 14px #23233a}.muted{color:#aeb2c2;font-size:13px}.option{display:block;width:100%;padding:13px;margin:8px 0;border:1px solid #ffffff0d;border-radius:12px;background:#222236;color:#fff;text-align:left;font-weight:700}.option.selected{background:#1db954;color:#fff}.result{display:none;text-align:center}.big{font-size:48px;font-weight:950;color:#62dc8b}</style></head><body><main class="app"><div class="top"><div class="brand">🎯 Top<span>Score</span></div><button class="btn" onclick="location.href='./leaderboard.html'">🏅 Leaderboard</button></div><section class="card"><h1>🔥 Daily JAMB Quiz</h1><p class="muted">10 questions. Your result contributes to today's Daily Quiz leaderboard.</p><div class="row"><span class="muted" id="counter">Question 1/10</span><span class="muted">Today</span></div></section><section class="card" id="quiz"></section><section class="card result" id="result"><div class="big" id="score"></div><h2 id="title"></h2><p id="message" class="muted"></p><button class="btn green" onclick="location.href='./leaderboard.html'">See Daily Leaderboard</button></section></main><script src="./topscore-core.js"></script><script>
const questions=[
['Biology','Which organelle is known as the powerhouse of the cell?',['Nucleus','Mitochondrion','Ribosome','Golgi body'],1],
['Physics','Which quantity is measured in newtons?',['Power','Energy','Force','Pressure'],2],
['Chemistry','What is the pH of a neutral solution at room temperature?',['0','5','7','14'],2],
['Mathematics','If 20% of x is 30, what is x?',['120','150','180','200'],1],
['English','Choose the correctly spelt word.',['Accomodation','Accommodation','Acommodation','Accommmodation'],1],
['Biology','Which blood cells help fight infection?',['Red blood cells','White blood cells','Platelets','Plasma'],1],
['Physics','The SI unit of electrical resistance is…',['Volt','Ampere','Ohm','Watt'],2],
['Chemistry','Which gas is released when an acid reacts with a carbonate?',['Oxygen','Hydrogen','Carbon dioxide','Nitrogen'],2],
['Mathematics','What is 3/4 expressed as a percentage?',['25%','50%','75%','80%'],2],
['English','The opposite of “scarce” is…',['Rare','Abundant','Small','Limited'],1]
];let i=0,answers=[];
async function init(){const p=await TopScore.requirePremium();if(!p)return;render();}function render(){const q=questions[i];document.getElementById('counter').textContent=`Question ${i+1}/${questions.length}`;document.getElementById('quiz').innerHTML=`<div class="muted">${q[0]}</div><h2>${q[1]}</h2>`+q[2].map((o,j)=>`<button class="option ${answers[i]===j?'selected':''}" onclick="choose(${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')+`<div class="row" style="margin-top:16px"><button class="btn" onclick="prev()">← Previous</button><button class="btn green" onclick="next()">${i===questions.length-1?'Submit':'Next →'}</button></div>`}function choose(j){answers[i]=j;render()}function prev(){if(i>0){i--;render()}}async function next(){if(answers[i]===undefined){alert('Choose an answer first.');return}if(i<questions.length-1){i++;render();return}let correct=0;questions.forEach((q,k)=>{if(answers[k]===q[3])correct++});const pct=Math.round(correct/questions.length*100);await TopScore.call('recordQuizResult',{scorePct:pct,correct,total:questions.length,topicKey:'daily-jamb-'+new Date().toISOString().slice(0,10),subject:'Daily Quiz',quizId:'daily-'+new Date().toISOString().slice(0,10),quizType:'daily'}).catch(console.warn);document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=pct+'%';document.getElementById('title').textContent=pct>=70?'🔥 Excellent work!':pct>=50?'👏 Good effort!':'📚 Keep practicing!';document.getElementById('message').textContent=`You got ${correct} out of ${questions.length} correct. Keep studying and come back tomorrow.`}init();
</script></body></html>
