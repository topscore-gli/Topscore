<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopScore Leaderboards</title><style>*{box-sizing:border-box}body{margin:0;background:#11111d;color:#fff;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:18px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:23px;font-weight:950}.brand span{color:#1db954}.btn{border:0;border-radius:12px;padding:11px 15px;background:#27273d;color:#fff;font-weight:800}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.tabs button{border:0;border-radius:13px;padding:13px;background:#202033;color:#aaa;font-weight:900}.tabs button.active{background:#1db954;color:#fff}.card{background:#1b1b2a;border-radius:20px;padding:18px;margin:12px 0;box-shadow:8px 8px 18px #0d0d15,-5px -5px 14px #23233a}.muted{color:#aeb2c2;font-size:13px}.rank{font-size:22px;font-weight:950;width:45px}.student{display:flex;align-items:center;gap:12px}.score{font-size:20px;font-weight:950;color:#62dc8b}.me{border:1px solid #1db95466}@media(max-width:520px){.app{padding:13px}}</style></head><body><main class="app"><div class="top"><div class="brand">🎯 Top<span>Score</span></div><button class="btn" onclick="location.href='./account.html'">My Account</button></div><h1>🏅 TopScore Leaderboards</h1><p class="muted">Compete, improve your score, and see how you rank among TopScore students. Daily Quiz rankings are practice submissions; Online Examination rankings use server-verified CBT results.</p><div class="tabs"><button id="daily" class="active">Daily Quiz</button><button id="online">Online Examination</button></div><div id="list">Loading…</div></main><script src="./topscore-core.js"></script><script>
const list=document.getElementById('list');let type='daily';document.getElementById('daily').onclick=()=>switchBoard('daily');document.getElementById('online').onclick=()=>switchBoard('online');async function switchBoard(t){type=t;document.getElementById('daily').classList.toggle('active',t==='daily');document.getElementById('online').classList.toggle('active',t==='online');load();}async function load(){try{await TopScore.requirePremium();const d=await TopScore.call('getLeaderboard',{type});list.innerHTML=(d.items||[]).map(x=>`<section class="card"><div class="row"><div class="student"><div class="rank">${x.rank===1?'🥇':x.rank===2?'🥈':x.rank===3?'🥉':'#'+x.rank}</div><div><b>${escapeHtml(x.name)}</b><div class="muted">${x.correct}/${x.total} correct</div></div></div><div class="score">${x.scorePct}%</div></div></section>`).join('')||'<section class="card"><p class="muted">No scores yet. Be the first!</p></section>';}catch(e){list.innerHTML='<section class="card"><p>'+escapeHtml(e.message||'Unable to load leaderboard.')+'</p></section>'}}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
