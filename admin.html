<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopScore Admin Panel</title><style>*{box-sizing:border-box}body{margin:0;background:#101019;color:#fff;font-family:system-ui,sans-serif}.app{max-width:1050px;margin:auto;padding:20px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:25px;font-weight:950}.brand span{color:#1db954}.btn{border:0;border-radius:11px;padding:10px 14px;background:#28283c;color:#fff;font-weight:800;cursor:pointer}.green{background:#1db954}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{white-space:nowrap;border:0;border-radius:11px;padding:11px 14px;background:#222235;color:#aaa;font-weight:800}.tabs button.active{background:#1db954;color:#fff}.card{background:#1a1a29;border:1px solid #ffffff08;border-radius:18px;padding:18px;margin:12px 0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px;border-bottom:1px solid #ffffff0a;text-align:left}.muted{color:#aeb2c2;font-size:13px}.badge{padding:4px 8px;border-radius:8px;background:#ffffff08;font-size:11px}.field{display:flex;gap:8px;flex-wrap:wrap}.input{padding:11px;border-radius:10px;border:1px solid #ffffff10;background:#11111d;color:#fff}.danger{color:#ff8181}.success{color:#62dc8b}</style></head><body><main class="app"><div class="top"><div class="brand">🎯 Top<span>Score</span> Admin</div><button class="btn" onclick="TopScore.logout()">Log out</button></div><div class="tabs"><button class="active" data-tab="exams">Top 50 Exams</button><button data-tab="daily">Daily Quiz</button><button data-tab="withdrawals">Withdrawals</button><button data-tab="gift">Gift Student</button><button data-tab="banks">Question Banks</button></div><div id="view">Loading…</div></main><script src="./topscore-core.js"></script><script>
const view=document.getElementById('view');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.tab)});async function load(tab='exams'){try{await TopScore.call('adminTopExams',{});if(tab==='exams')return exams();if(tab==='daily')return daily();if(tab==='withdrawals')return withdrawals();if(tab==='gift')return gift();if(tab==='banks')return banks();}catch(e){view.innerHTML=`<section class="card"><h2>Access denied</h2><p class="muted">${escapeHtml(e.message||'Your account is not an admin account yet.')}</p><p class="muted">To activate your admin account, set <b>role: "admin"</b> on your user document in Firestore, or set the Firebase Auth custom claim <b>admin: true</b>.</p></section>`}}
async function exams(){const d=await TopScore.call('adminTopExams',{});view.innerHTML='<section class="card"><h2>🏆 Top 50 Online Examination Students</h2><div class="table-wrap"><table class="table"><tr><th>#</th><th>Student</th><th>Email</th><th>Exam</th><th>Score</th><th>Correct</th><th>Gift</th></tr>'+d.items.map(x=>`<tr><td>${x.rank}</td><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.email)}</td><td>${escapeHtml(x.examId)}</td><td class="success"><b>${x.scorePct}%</b></td><td>${x.correct}/${x.total}</td><td><button class="btn green" onclick="gift('${x.uid}')">Gift</button></td></tr>`).join('')+'</table></div></section>'}
async function daily(){const d=await TopScore.call('adminLeaderboard',{type:'daily'});view.innerHTML='<section class="card"><h2>📅 Today\'s Daily Quiz Leaderboard</h2><div class="table-wrap"><table class="table"><tr><th>#</th><th>Student</th><th>Score</th><th>Correct</th><th>Gift</th></tr>'+d.items.map(x=>`<tr><td>${x.rank}</td><td>${escapeHtml(x.name)}</td><td class="success">${x.scorePct}%</td><td>${x.correct}/${x.total}</td><td><button class="btn green" onclick="gift('${x.uid}')">Gift</button></td></tr>`).join('')+'</table></div></section>'}
async function withdrawals(){const d=await TopScore.call('adminPendingWithdrawals',{});view.innerHTML='<section class="card"><h2>💰 Withdrawal queue</h2><p class="muted">Initiating/processing transfers are locked against duplicate payment. Final status is updated by verified Paystack transfer webhooks. Do not manually retry an uncertain transfer.</p><div class="table-wrap"><table class="table"><tr><th>Student UID</th><th>Amount</th><th>Bank</th><th>Account</th><th>Status</th><th>Action</th></tr>'+d.items.map(x=>`<tr><td>${escapeHtml(x.uid)}</td><td class="success">₦${Number(x.amount).toLocaleString()}</td><td>${escapeHtml(x.bankAccount?.bankName||'')}</td><td>${escapeHtml(x.bankAccount?.accountNumber||'')}<br>${escapeHtml(x.bankAccount?.accountName||'')}</td><td>${escapeHtml(x.status)}<br><small class="muted">${escapeHtml(x.transferReference||'')}</small></td><td>${x.status==='pending'?`<button class="btn green" onclick="approve('${x.id}')">Initiate</button> <button class="btn" onclick="reject('${x.id}')">Reject</button>`:'<span class="badge">Await webhook / reconciliation</span>'}</td></tr>`).join('')+'</table></div></section>'}
async function banks(){const d=await TopScore.call('adminGetQuestionBankStatus',{});view.innerHTML='<section class="card"><h2>📚 CBT Question Bank Publishing</h2><p class="muted">A bank needs at least 60 English questions or 40 elective questions, with no malformed or duplicate question text. New subjects stay unavailable until a reviewer attests to academic review and an administrator activates them. Existing five banks are shown as legacy active until explicitly reviewed.</p><div class="table-wrap"><table class="table"><tr><th>Subject</th><th>Questions</th><th>Academic review</th><th>CBT status</th><th>Action</th></tr>'+d.items.map(x=>{const ready=x.structurallyReady;const state=x.legacy&&!x.academicallyReviewed?'Legacy active · review pending':x.enabled?'Active':x.academicallyReviewed?'Reviewed · inactive':'Not reviewed';const action=x.enabled?(x.legacy&&!x.academicallyReviewed?`<button class="btn green" ${ready?'':'disabled'} onclick="activateBank('${x.key}')">Record review</button>`:`<button class="btn" onclick="deactivateBank('${x.key}')">Deactivate</button>`):`<button class="btn green" ${ready?'':'disabled'} onclick="activateBank('${x.key}')">Review &amp; activate</button>`;return `<tr><td><b>${escapeHtml(x.name)}</b></td><td>${x.count}/${x.required} ${ready?'<span class="success">✓</span>':'<span class="danger">Check bank</span>'}<br><small class="muted">${x.invalidCount} invalid · ${x.duplicateCount} duplicates</small></td><td>${x.academicallyReviewed?'<span class="success">Reviewed</span>':'<span class="danger">Pending</span>'}</td><td>${escapeHtml(state)}</td><td>${action}</td></tr>`}).join('')+'</table></div><p class="muted">Counts are read from the private Firebase Secret Manager bank. The review record captures the reviewer name and attestation; it is not independent verification of that person’s qualifications.</p></section>'}
async function activateBank(key){const d=await TopScore.call('adminGetQuestionBankStatus',{}),x=d.items.find(v=>v.key===key);if(!x||!x.structurallyReady){alert('This bank does not yet meet the minimum question count.');return}if(!confirm('Confirm that a qualified subject teacher has reviewed question accuracy, answer keys, explanations, syllabus coverage and ambiguity for this entire bank?'))return;const reviewerName=prompt('Qualified reviewer name:');if(!reviewerName)return;const reviewNotes=prompt('Review notes (at least 20 characters):');if(!reviewNotes)return;try{await TopScore.call('adminUpdateQuestionBankStatus',{subjectKey:key,enabled:true,academicallyReviewed:true,reviewerName,reviewNotes});alert('Subject bank activated.');banks()}catch(e){alert(e.message)}}
async function deactivateBank(key){if(!confirm('Deactivate this subject for new CBT entries? Existing submitted results will remain.'))return;try{await TopScore.call('adminUpdateQuestionBankStatus',{subjectKey:key,enabled:false,academicallyReviewed:false});alert('Subject bank deactivated.');banks()}catch(e){alert(e.message)}}
function gift(uid){const p=prompt('How many study points should be gifted?','500');if(!p)return;const reason=prompt('Reason','TopScore performance reward')||'Admin reward gift';TopScore.call('adminGift',{uid,points:Number(p),reason}).then(()=>{alert('Gift sent.');exams()}).catch(e=>alert(e.message))}async function approve(id){if(!confirm('Initiate this bank transfer?'))return;try{await TopScore.call('adminApproveWithdrawal',{withdrawalId:id});alert('Transfer initiated through Paystack.');withdrawals()}catch(e){alert(e.message)}}async function reject(id){const reason=prompt('Reason for rejection','Please verify your bank details');try{await TopScore.call('adminRejectWithdrawal',{withdrawalId:id,reason});withdrawals()}catch(e){alert(e.message)}}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
