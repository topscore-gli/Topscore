<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopScore Online Examinations</title><style>*{box-sizing:border-box}body{margin:0;background:#1e1e2f;color:#fff;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:23px;font-weight:900}.brand span{color:#1db954}.card{background:#1e1e2f;border-radius:22px;padding:22px;margin:14px 0;box-shadow:8px 8px 18px #141420,-8px -8px 18px #29293e}.exam{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.badge{display:inline-block;padding:5px 10px;border-radius:99px;background:#1db95422;color:#62dc8b;font-size:11px;font-weight:800}.muted{color:#aeb2c2;font-size:13px;line-height:1.6}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:8px 12px;border-radius:10px;background:#ffffff08;font-size:12px}.btn{border:0;border-radius:12px;padding:13px 18px;background:#1db954;color:#fff;font-weight:900}.btn:disabled{opacity:.5}@media(max-width:560px){.exam{grid-template-columns:1fr}.btn{width:100%}}</style></head><body><main class="app"><div class="top"><div class="brand">🎯 Top<span>Score</span></div><button class="btn" style="background:#25253b" onclick="location.href='./account.html'">⭐ <span id="pts">0</span></button></div><h1>Online Examinations</h1><p class="muted">Use your study points to enter JAMB-style online examinations. Each exam clearly shows its point entry cost before you join.</p><div id="list">Loading exams…</div></main><script src="./topscore-core.js"></script><script>
(async()=>{try{const p=await TopScore.requirePremium();if(!p)return;document.getElementById("pts").textContent=(p.points||0).toLocaleString();const r=await TopScore.call("listExams",{});const list=document.getElementById("list");list.innerHTML="";(r.items||[]).forEach(ex=>{const el=document.createElement("section");el.className="card exam";el.innerHTML=`<div><span class="badge">OPEN</span><h2>${ex.title}</h2><p class="muted">${ex.description||""}</p><p class="muted"><strong>Your selected subjects:</strong> ${(r.yourSubjects||[]).map(x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))).join(', ')||'Not set'}</p><div class="stats"><span class="stat">⏱ ${ex.durationMinutes||120} minutes</span><span class="stat">⭐ ${ex.entryPoints||500} points</span></div></div><button class="btn">Join for ${ex.entryPoints||500} points</button>`;el.querySelector("button").onclick=async()=>{const b=el.querySelector("button");b.disabled=true;b.textContent="Joining…";try{const j=await TopScore.call("joinExam",{examId:ex.id});sessionStorage.setItem("tsExamId",ex.id);location.href="./"+(ex.page||"jambexam.html")}catch(e){alert(e.message||"Unable to join exam.");b.disabled=false;b.textContent=`Join for ${ex.entryPoints||500} points`}};list.appendChild(el)});if(!r.items?.length)list.innerHTML='<section class="card"><h2>No examinations are open</h2><p class="muted">Check back soon for the next TopScore mock.</p></section>';}catch(e){document.getElementById("list").innerHTML='<section class="card"><h2>Unable to load examinations</h2><p class="muted">'+(e.message||"Please try again.")+'</p></section>'}})();
</script></body></html>
